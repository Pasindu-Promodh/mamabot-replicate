name: Push to Replicate

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Cog
        uses: replicate/setup-cog@v2
        with:
          install-cuda: true
          
      - name: Push to Replicate
        env:
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
          COG_TOKEN: ${{ secrets.COG_TOKEN }}
        run: |
          cog login --token $COG_TOKEN
          cog push r8.im/pasindu-promodh/mamabot-llama
#push.yml
name: Push to Replicate

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      # Make HF token available to ALL steps
      HUGGING_FACE_HUB_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
      
    steps:
      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/swift
          sudo apt-get clean
          docker system prune -a -f
          
          echo "Disk space after cleanup:"
          df -h
          
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Cog
        run: |
          sudo curl -o /usr/local/bin/cog -L "https://github.com/replicate/cog/releases/latest/download/cog_$(uname -s)_$(uname -m)"
          sudo chmod +x /usr/local/bin/cog
          cog --version
      
      - name: Login to Replicate
        env:
          COG_TOKEN: ${{ secrets.COG_TOKEN }}
        run: |
          echo "$COG_TOKEN" | cog login --token-stdin
      
      - name: Build Docker Image
        run: |
          echo "Available disk space before build:"
          df -h
          
          echo "Building image (this will download the model during setup)..."
          cog build 2>&1 | tee build.log
          
          # Extract the image ID from build output
          IMAGE_ID=$(docker images --format "{{.ID}}" | head -n 1)
          echo "Built image ID: $IMAGE_ID"
          
          # Tag it properly for Replicate
          docker tag $IMAGE_ID r8.im/pasindu-promodh/mamabot-llama:latest
          
          echo "Image tagged successfully"
          docker images | grep mamabot-llama
          
      - name: Push to Replicate
        run: |
          echo "Pushing to Replicate..."
          cog push r8.im/pasindu-promodh/mamabot-llama